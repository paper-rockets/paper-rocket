name: Deploy Multi-Demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (V16)
        uses: actions/checkout@v4
        with:
          path: v16-workspace

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build V16 Studio Demo
        run: |
          cd v16-workspace
          npm install
          npm run build
          mkdir -p ../dist-all/v16
          cp -r dist/* ../dist-all/v16/
          cd ..

      - name: Build V14 Classic Demo
        run: |
          # If v14 directory or branch is present, build it; otherwise replicate baseline build
          if [ -d "v16-workspace/v14" ]; then
            cd v16-workspace/v14
            npm install
            npm run build
            mkdir -p ../../dist-all/v14
            cp -r dist/* ../../dist-all/v14/
            cd ../..
          else
            # Create v14 standalone bundle
            mkdir -p dist-all/v14
            cp -r dist-all/v16/* dist-all/v14/
          fi

      - name: Create Landing Portal Index
        run: |
          if [ -f "v16-workspace/public/portal.html" ]; then
            cp v16-workspace/public/portal.html dist-all/index.html
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist-all'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
